[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-cta"
version = "1.1.0"
description = "AI-based predictive safety framework for high-hazard industrial facilities."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Ilia Serebriakov", email = "allarayzer@gmail.com" },
]
keywords = [
    "industrial-ai",
    "predictive-safety",
    "predictive-maintenance",
    "anomaly-detection",
    "isolation-forest",
    "lstm",
    "conformal-prediction",
    "remaining-useful-life",
    "rul",
    "drift-detection",
    "condition-monitoring",
    "functional-safety",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "requests>=2.31",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]
[project.optional-dependencies]
deep = ["tensorflow>=2.13"]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]
test = ["pytest>=7.4", "pytest-cov>=4.1"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.5",
    "jupyter>=1.0",
]
benchmarks = [
    "tensorflow>=2.13",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]
all = [
    "tensorflow>=2.13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "jupyter>=1.0",
]
[project.urls]
Homepage = "https://github.com/Allarayzer/ai-industrial-predictive-safety"
Documentation = "https://github.com/Allarayzer/ai-industrial-predictive-safety/tree/main/docs"
Repository = "https://github.com/Allarayzer/ai-industrial-predictive-safety"
Issues = "https://github.com/Allarayzer/ai-industrial-predictive-safety/issues"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
ai_cta = ["py.typed"]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# E501: line length (handled by formatter)
# N803/N806: uppercase argument / variable names — we use X, Y, Xs for
#   matrices (sklearn/pandas/tensorflow convention); no fix planned.
# N802: method names — some keep sklearn's camelCase (decision_function, etc.)
# E402: module-level import not at top — intentional for optional
#   tensorflow imports inside try/except.
ignore = ["E501", "N803", "N806", "N802", "E402"]
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
